about_paragraphs:
  - "I am a PhD student in Biological Sciences specializing in plant molecular biology. My research focuses on understanding the molecular mechanisms governing gene regulation, functional genomics, and adaptive responses to environmental stress in model and crop plants."
  - "By bridging rigorous wet-lab molecular biochemistry (CRISPR/Cas9, transcriptomics, confocal imaging) with computational biology (RNA-seq pipelines, gene regulatory network modeling), I aim to uncover novel molecular targets that improve plant resilience and development."

