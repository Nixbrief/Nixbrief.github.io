about_paragraphs:
  - "I am a PhD student trained in Biotechnology Engineering and Biological Sciences, with a particular interest in plant science and somatic embryogenesis. My research experience has allowed me to approach biological questions from both experimental and computational perspectives. Beyond my research, I am interested in science communication, bioinformatics, and programming in R and Python, as well as contributing to the development and visibility of plant science in Mexico. I am especially interested in finding clear ways to connect biological questions, data, and scientific communication."
  - "Outside of research, I share my life with my cat, Haruki, and my dog, Zizek. They are an important part of my everyday life and bring a welcome balance to the academic side of things."
