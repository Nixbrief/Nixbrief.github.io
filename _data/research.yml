- id: "functional-genomics"
  title: "Functional Genomics & Transcriptional Networks"
  icon: "🧬"
  topic: "Genomics & Gene Regulation"
  description: "I investigate transcription factor cascades and chromatin remodeling events that regulate plant development and acclimation under stress conditions. By combining high-throughput RNA-seq with ChIP-seq assays, I map genome-wide binding dynamics of master regulators to decode gene regulatory networks."
  highlight: "Focus on mapping genome-wide binding dynamics and transcriptional cascades in response to abiotic stimuli."
  model_organisms:
    - "Arabidopsis thaliana"
    - "Solanum lycopersicum"
  keywords:
    - "RNA-seq"
    - "ChIP-qPCR"
    - "Gene Regulatory Networks"
    - "Differential Expression"

- id: "crispr-editing"
  title: "Targeted Genome Editing with CRISPR/Cas"
  icon: "✂️"
  topic: "Precision Genome Engineering"
  description: "My work focuses on developing and deploying multiplex CRISPR/Cas9 and Cas12a vectors for precise targeted mutagenesis and functional characterization of uncharacterized plant gene families. I design tissue-specific and inducible expression systems to dissect redundant signaling components in hormonal crosstalk."
  highlight: "Designing tissue-specific multiplex vectors and inducible expression systems for functional characterization."
  model_organisms:
    - "Arabidopsis thaliana"
    - "Nicotiana benthamiana"
  keywords:
    - "Multiplex sgRNA"
    - "Golden Gate Assembly"
    - "Protoplast Transfection"
    - "Deep Sequencing"

- id: "abiotic-stress"
  title: "Epigenetics & Abiotic Stress Memory"
  icon: "🌱"
  topic: "Epigenetic Dynamics & Resilience"
  description: "I explore how DNA methylation patterns and histone modifications establish molecular memory following cyclical drought and salinity stress. Through characterization of mutant lines deficient in chromatin modifiers, I evaluate phenotypic recovery and multi-generational transcriptional priming in resilient plant systems."
  highlight: "Investigating chromatin modifications and generational priming following cyclical drought and salinity stress."
  model_organisms:
    - "Arabidopsis thaliana"
  keywords:
    - "Bisulfite Sequencing"
    - "RT-qPCR"
    - "Confocal Microscopy"
    - "Stress Priming"
